        .glass-card {

        .glass-card:hover {

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInAnonymously, 
            signInWithCustomToken, 
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            onAuthStateChanged,
            updateProfile
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            getDocs, 
            setDoc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'reecarna-store-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "AIzaSyDemoConfigKeyForReecarnaStore",
            authDomain: "reecarna-store.firebaseapp.com",
            projectId: "reecarna-store",
            storageBucket: "reecarna-store.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Export to window for React component access
        window.FB = {
            appId,
            auth,
            db,
            signInAnonymously,
            signInWithCustomToken,
            createUserWithEmailAndPassword,
            signInWithEmailAndPassword,
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            onAuthStateChanged,
            updateProfile,
            collection,
            doc,
            getDocs,
            setDoc,
            addDoc,
            updateDoc,
            deleteDoc,
            onSnapshot
        };
    </script>

    <!-- Main React Application -->
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Default Initial Catalog
        const INITIAL_PRODUCTS = [
            {
                id: "p1",
                name: "Zapatillas Urban Elegance Reecarná",
                category: "Calzado",
                priceUSD: 45.00,
                description: "Calzado de vestir y estilo urbano con acabados prémium en borgoña y suela antideslizante.",
                image: "https://images.unsplash.com/photo-1549298916-b41d501d3772?auto=format&fit=crop&w=800&q=80",
                stock: 12
            },
            {
                id: "p2",
                name: "Perfume Borgoña Nocturno (100ml)",
                category: "Perfumería",
                priceUSD: 35.00,
                description: "Fragancia intensa con notas de ámbar, madera de cedro y esencia floral exclusiva.",
                image: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=800&q=80",
                stock: 8
            },
            {
                id: "p3",
                name: "Chaqueta de Cuero Estilo Reecarná",
                category: "Ropa",
                priceUSD: 85.00,
                description: "Chaqueta de corte elegante con cierres metálicos en dorado y forro térmico suave.",
                image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?auto=format&fit=crop&w=800&q=80",
                stock: 5
            },
            {
                id: "p4",
                name: "Reloj Cronógrafo Dorado Vintage",
                category: "Accesorios",
                priceUSD: 60.00,
                description: "Esfera de lujo resistente al agua, movimiento de precisión y pulsera en dorado pulido.",
                image: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=800&q=80",
                stock: 10
            }
        ];

        const PHONE_NUMBERS = [
            { display: "+53 51288111", value: "5351288111", label: "Línea Principal" },
            { display: "+53 55964158", value: "5355964158", label: "Atención a Ventas" }
        ];

        const ADMIN_SECRET_PIN = "reecarna2026";

        function App() {
            // App State
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [products, setProducts] = useState(INITIAL_PRODUCTS);
            const [cart, setCart] = useState([]);
            const [exchangeRate, setExchangeRate] = useState(330); 
            const [currency, setCurrency] = useState('USD');
            
            // Search & Filtering
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('Todos');

            // UI Modals
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isAuthModalOpen, setIsAuthModalOpen] = useState(false);
            const [isAdminAuthModalOpen, setIsAdminAuthModalOpen] = useState(false);
            const [isProductModalOpen, setIsProductModalOpen] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null);
            const [selectedPhone, setSelectedPhone] = useState(PHONE_NUMBERS[0].value);
            
            // Auth Form State
            const [authTab, setAuthTab] = useState('login');
            const [authEmail, setAuthEmail] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [authName, setAuthName] = useState('');
            
            // Admin PIN input
            const [adminPinInput, setAdminPinInput] = useState('');

            // Product Editor State
            const [productForm, setProductForm] = useState({
                id: '', name: '', category: 'Calzado', priceUSD: '', description: '', image: '', stock: 10
            });
            const [imagePreview, setImagePreview] = useState('');
            const fileInputRef = useRef(null);

            // Toast Alerts
            const [toast, setToast] = useState(null);

            // Checkout Form
            const [checkoutForm, setCheckoutForm] = useState({
                name: '', phone: '', address: '', notes: ''
            });

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 3500);
            };

            // Initialize Firebase Listeners
            useEffect(() => {
                let unsubscribeAuth = () => {};
                let unsubscribeProducts = () => {};

                const initFirebase = async () => {
                    if (!window.FB) return;
                    const { auth, db, appId, signInWithCustomToken, signInAnonymously, onAuthStateChanged, collection, onSnapshot } = window.FB;

                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else if (!auth.currentUser) {
                            await signInAnonymously(auth);
                        }
                    } catch (e) {
                        console.warn("Auth setup fallback:", e);
                    }

                    unsubscribeAuth = onAuthStateChanged(auth, (currentUser) => {
                        setUser(currentUser);
                        if (currentUser && currentUser.email && (currentUser.email.includes('admin') || currentUser.email.includes('reecarna'))) {
                            setIsAdmin(true);
                        }
                    });

                    try {
                        const prodRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
                        unsubscribeProducts = onSnapshot(prodRef, (snapshot) => {
                            if (!snapshot.empty) {
                                const items = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                                setProducts(items);
                            }
                        }, (err) => console.warn("Firestore listener warning:", err));
                    } catch (err) {
                        console.warn("Firestore error fallback:", err);
                    }
                };

                initFirebase();

                return () => {
                    if (unsubscribeAuth) unsubscribeAuth();
                    if (unsubscribeProducts) unsubscribeProducts();
                };
            }, []);

            const handleImageFileSelect = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    showToast("Por favor seleccione un archivo de imagen válido", "error");
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width = Math.round((width * MAX_HEIGHT) / height); height = MAX_HEIGHT; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedBase64 = canvas.toDataURL('image/jpeg', 0.75);
                        setProductForm(prev => ({ ...prev, image: compressedBase64 }));
                        setImagePreview(compressedBase64);
                        showToast("Foto cargada correctamente");
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const categories = useMemo(() => ['Todos', ...new Set(products.map(p => p.category))], [products]);

            const filteredProducts = useMemo(() => {
                return products.filter(p => {
                    const matchesCategory = selectedCategory === 'Todos' || p.category === selectedCategory;
                    const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase()) || p.description.toLowerCase().includes(searchQuery.toLowerCase());
                    return matchesCategory && matchesSearch;
                });
            }, [products, selectedCategory, searchQuery]);

            const addToCart = (product) => {
                setCart(prev => {
                    const existing = prev.find(item => item.id === product.id);
                    if (existing) return prev.map(item => item.id === product.id ? { ...item, quantity: item.quantity + 1 } : item);
                    return [...prev, { ...product, quantity: 1 }];
                });
                showToast(`"${product.name}" agregado al carrito`);
            };

            const updateQuantity = (id, delta) => {
                setCart(prev => prev.map(item => {
                    if (item.id === id) {
                        const newQty = item.quantity + delta;
                        return newQty > 0 ? { ...item, quantity: newQty } : null;
                    }
                    return item;
                }).filter(Boolean));
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.filter(item => item.id !== id));
                showToast("Producto eliminado del carrito", "info");
            };

            const totalUSD = useMemo(() => cart.reduce((sum, item) => sum + (item.priceUSD * item.quantity), 0), [cart]);
            const totalCUP = useMemo(() => Math.round(totalUSD * exchangeRate), [totalUSD, exchangeRate]);

            const formatPrice = (priceUSD) => {
                if (currency === 'CUP') return `${Math.round(priceUSD * exchangeRate).toLocaleString('es-CU')} CUP`;
                return `$${priceUSD.toFixed(2)} USD`;
            };

            const handleAdminAccess = (e) => {
                e.preventDefault();
                if (adminPinInput === ADMIN_SECRET_PIN || adminPinInput.toLowerCase() === 'reecarna') {
                    setIsAdmin(true);
                    setIsAdminAuthModalOpen(false);
                    setAdminPinInput('');
                    showToast("Acceso Propietario concedido", "success");
                } else {
                    showToast("Clave incorrecta", "error");
                }
            };

            const handleEmailAuth = async (e) => {
                e.preventDefault();
                if (!window.FB) return;
                const { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } = window.FB;
                try {
                    if (authTab === 'signup') {
                        const res = await createUserWithEmailAndPassword(auth, authEmail, authPassword);
                        if (authName && res.user) await updateProfile(res.user, { displayName: authName });
                        showToast(`Bienvenido, ${authName || authEmail}`);
                    } else {
                        await signInWithEmailAndPassword(auth, authEmail, authPassword);
                        showToast("Sesión iniciada");
                    }
                    setIsAuthModalOpen(false);
                    setAuthEmail(''); setAuthPassword(''); setAuthName('');
                } catch (err) {
                    showToast("Error de autenticación. Verifique sus datos.", "error");
                }
            };

            const handleGoogleAuth = async () => {
                if (!window.FB) return;
                try {
                    const provider = new window.FB.GoogleAuthProvider();
                    await window.FB.signInWithPopup(window.FB.auth, provider);
                    setIsAuthModalOpen(false);
                    showToast("Sesión iniciada con Google");
                } catch (err) {
                    showToast("No se pudo completar el inicio con Google", "error");
                }
            };

            const handleSaveProduct = async (e) => {
                e.preventDefault();
                if (!isAdmin) return showToast("Permiso denegado", "error");
                if (!productForm.name || !productForm.priceUSD) return showToast("Complete los campos requeridos", "error");

                const finalImage = productForm.image || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80";
                const newProdData = {
                    name: productForm.name, category: productForm.category,
                    priceUSD: parseFloat(productForm.priceUSD), description: productForm.description,
                    image: finalImage, stock: parseInt(productForm.stock) || 10, updatedAt: new Date().toISOString()
                };

                try {
                    const { db, appId, collection, addDoc, doc, setDoc } = window.FB;
                    if (productForm.id) {
                        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', productForm.id);
                        await setDoc(docRef, newProdData, { merge: true });
                        showToast("Producto actualizado");
                    } else {
                        const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'products');
                        await addDoc(colRef, newProdData);
                        showToast("Producto publicado");
                    }
                } catch (err) {
                    if (productForm.id) setProducts(prev => prev.map(p => p.id === productForm.id ? { ...p, ...newProdData } : p));
                    else setProducts(prev => [...prev, { id: 'p_' + Date.now(), ...newProdData }]);
                    showToast("Producto guardado localmente");
                }

                setProductForm({ id: '', name: '', category: 'Calzado', priceUSD: '', description: '', image: '', stock: 10 });
                setImagePreview('');
                setIsProductModalOpen(false);
            };

            const handleDeleteProduct = async (productId) => {
                if (!isAdmin) return;
                if (!confirm("¿Confirma que desea eliminar este producto?")) return;
                try {
                    const { db, appId, doc, deleteDoc } = window.FB;
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'products', productId);
                    await deleteDoc(docRef);
                    showToast("Producto eliminado", "info");
                } catch (err) {
                    setProducts(prev => prev.filter(p => p.id !== productId));
                    showToast("Producto eliminado", "info");
                }
            };

            const handleWhatsAppCheckout = () => {
                if (cart.length === 0) return showToast("Tu carrito está vacío", "error");
                if (!checkoutForm.name) return showToast("Escribe tu nombre", "error");

                let msg = `🛒 *NUEVO PEDIDO - TIENDA REECARNÁ*\n---------------------------------\n`;
                msg += `👤 *Cliente:* ${checkoutForm.name}\n`;
                if (checkoutForm.phone) msg += `📞 *Teléfono:* ${checkoutForm.phone}\n`;
                if (checkoutForm.address) msg += `📍 *Dirección:* ${checkoutForm.address}\n`;
                msg += `---------------------------------\n📦 *DETALLE:*\n`;

                cart.forEach((item, index) => {
                    const subCUP = Math.round((item.priceUSD * item.quantity) * exchangeRate);
                    msg += `${index + 1}. *${item.name}* (x${item.quantity})\n   • Precio: $${item.priceUSD.toFixed(2)} USD (~${subCUP.toLocaleString('es-CU')} CUP)\n`;
                });

                msg += `---------------------------------\n💰 *TOTAL:*\n`;
                msg += `💵 *USD:* $${totalUSD.toFixed(2)} USD\n`;
                msg += `🇨🇺 *CUP (Tasa ${exchangeRate}):* ${totalCUP.toLocaleString('es-CU')} CUP\n`;
                if (checkoutForm.notes) msg += `---------------------------------\n📝 *Nota:* ${checkoutForm.notes}\n`;
                msg += `\n✨ *Gracias por elegir Reecarná!*`;

                window.open(`https://wa.me/${selectedPhone}?text=${encodeURIComponent(msg)}`, '_blank');
                showToast("Redirigiendo a WhatsApp...", "success");
            };

            return (
                <div className="flex-1 flex flex-col min-h-screen">
                    
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed top-20 right-4 z-50 animate-bounce">
                            <div className={`px-5 py-3 rounded-xl shadow-2xl flex items-center space-x-3 text-sm font-semibold border ${
                                toast.type === 'error' ? 'bg-red-950 border-red-500 text-white' :
                                toast.type === 'info' ? 'bg-wine-900 border-blue-400 text-white' :
                                'bg-wine-950 border-gold-500 text-gold-300'
                            }`}>
                                <i className={`fas ${toast.type === 'error' ? 'fa-exclamation-circle' : toast.type === 'info' ? 'fa-info-circle' : 'fa-check-circle'} text-lg`}></i>
                                <span>{toast.message}</span>
                            </div>
                        </div>
                    )}

                    {/* Top Announcement Header Bar */}
                    <div className="bg-gradient-to-r from-wine-950 via-wine-800 to-wine-950 text-gold-300 text-xs py-2 px-4 border-b border-wine-700/50 flex flex-wrap justify-between items-center gap-2">
                        <div className="flex items-center space-x-3 mx-auto sm:mx-0">
                            <span className="flex items-center space-x-1">
                                <i className="fab fa-whatsapp text-emerald-400 text-sm"></i>
                                <span>WhatsApp: <strong>+53 51288111</strong> / <strong>+53 55964158</strong></span>
                            </span>
                        </div>
                        <div className="flex items-center space-x-3 mx-auto sm:mx-0">
                            <span>Tasa CUP: 1 USD = <strong>{exchangeRate} CUP</strong></span>
                            <button 
                                onClick={() => setCurrency(c => c === 'USD' ? 'CUP' : 'USD')}
                                className="bg-wine-800 hover:bg-wine-700 text-gold-300 text-[10px] px-2.5 py-0.5 rounded-full border border-gold-500/30 font-semibold transition"
                            >
                                Mostrar en {currency === 'USD' ? 'CUP' : 'USD'}
                            </button>
                        </div>
                    </div>

                    {/* Header Navigation */}
                    <header className="sticky top-0 z-40 glass-panel border-b border-wine-700/40 px-4 md:px-10 py-3.5">
                        <div className="max-w-7xl mx-auto flex items-center justify-between gap-4">
                            
                            {/* Logo */}
                            <a href="#" className="flex items-center space-x-3 group">
                                <div className="w-11 h-11 rounded-full bg-gradient-to-br from-gold-400 via-gold-500 to-wine-700 flex items-center justify-center text-wine-950 font-serif font-black text-2xl shadow-xl border border-gold-300 group-hover:scale-105 transition-transform">
                                    R
                                </div>
                                <div>
                                    <h1 className="font-serif text-2xl md:text-3xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-gold-300 via-amber-100 to-gold-400">
                                        Reecarná
                                    </h1>

                                    <div className="pt-4 border-t border-wine-700/50 flex justify-end space-x-3">
                                        <button type="button" onClick={() => setIsProductModalOpen(false)} className="px-4 py-2 rounded-lg text-sm text-slate-300 hover:bg-wine-800 transition">Cancelar</button>
                                        <button type="submit" className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white px-6 py-2 rounded-lg text-sm font-bold shadow-lg transition">
                                            {productForm.id ? 'Guardar Cambios' : 'Publicar en la Tienda'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 5. Product Detail Modal */}
                    {selectedProduct && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 animate-fade-in" onClick={() => setSelectedProduct(null)}>
                            <div className="bg-wine-950 border border-wine-700/50 rounded-2xl w-full max-w-3xl overflow-hidden shadow-2xl relative flex flex-col md:flex-row" onClick={e => e.stopPropagation()}>
                                <button onClick={() => setSelectedProduct(null)} className="absolute top-3 right-3 text-white bg-black/50 hover:bg-black w-8 h-8 rounded-full flex items-center justify-center z-10 backdrop-blur-sm"><i className="fas fa-times"></i></button>
                                
                                <div className="w-full md:w-1/2 h-64 md:h-auto">
                                    <img src={selectedProduct.image} alt={selectedProduct.name} className="w-full h-full object-cover" />
                                </div>
                                <div className="w-full md:w-1/2 p-6 md:p-8 flex flex-col justify-center">
                                    <span className="text-xs font-bold text-gold-500 uppercase tracking-wider mb-2">{selectedProduct.category}</span>
                                    <h2 className="font-serif text-2xl md:text-3xl font-bold text-white mb-4">{selectedProduct.name}</h2>
                                    <p className="text-slate-300 text-sm mb-6 leading-relaxed">{selectedProduct.description}</p>
                                    
                                    <div className="mt-auto">
                                        <div className="flex items-end justify-between mb-4">
                                            <div>
                                                <p className="text-3xl font-bold text-gold-300">{formatPrice(selectedProduct.priceUSD)}</p>
                                                <p className="text-xs text-slate-500">Disponibles: {selectedProduct.stock}</p>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => { addToCart(selectedProduct); setSelectedProduct(null); }} 
                                            className="w-full bg-gradient-to-r from-wine-600 to-wine-700 hover:from-gold-500 hover:to-gold-600 hover:text-wine-950 text-white font-bold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2"
                                        >
                                            <i className="fas fa-cart-plus"></i>
                                            <span>Añadir al Carrito</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
